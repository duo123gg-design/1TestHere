
name: Export ZIP as artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: test -s Kuro3D_V706_TILED_2D_PREVIEW_OPTIMIZATION_PASS113.zip && ls -lh Kuro3D_V706_TILED_2D_PREVIEW_OPTIMIZATION_PASS113.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source-Kuro3D_V706_TILED_2D_PREVIEW_OPTIMIZATION_PASS113.zip
          path: Kuro3D_V706_TILED_2D_PREVIEW_OPTIMIZATION_PASS113.zip
          if-no-files-found: error
          retention-days: 1
