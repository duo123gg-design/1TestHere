
name: Export ZIP as artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: test -s 12619170.zip && ls -lh 12619170.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source-12619170.zip
          path: 12619170.zip
          if-no-files-found: error
          retention-days: 1
